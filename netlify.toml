[build]
  publish = "web"

[functions]
  directory = "netlify/functions"

# Cada sección de la app vive en su carpeta: /join hoy; /tournaments, /lessons… más adelante.
[[redirects]]
  from = "/join"
  to = "/join/index.html"
  status = 200

[[redirects]]
  from = "/tournaments"
  to = "/tournaments/index.html"
  status = 200

[[redirects]]
  from = "/social-events"
  to = "/social-events/index.html"
  status = 200

[[redirects]]
  from = "/lessons"
  to = "/lessons/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
